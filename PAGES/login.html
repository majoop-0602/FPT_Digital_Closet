<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in | Closetix</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
    />
    <link href="../CSS/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <aside class="side" style="background: #ffc1cc; color: #3b1414">
        <div
          class="shape fl"
          style="
            right: -30px;
            top: 90px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #9f2d2d;
          "
        ></div>
        <div
          class="shape sp"
          style="
            right: 70px;
            bottom: 60px;
            width: 120px;
            height: 120px;
            background: #fff0df;
            border: 0;
            clip-path: polygon(
              50% 0,
              61% 35%,
              98% 35%,
              68% 57%,
              79% 91%,
              50% 70%,
              21% 91%,
              32% 57%,
              2% 35%,
              39% 35%
            );
          "
        ></div>
        <div
          class="shape fl"
          style="
            left: 45%;
            top: 28%;
            width: 80px;
            height: 70px;
            background: #3b1414;
            border: 0;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
          "
        ></div>
        <a class="brand" href="../Index.html" style="color: #3b1414">
          <span class="mark"
            ><i
              style="
                left: 0;
                top: 0;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: #9f2d2d;
                border: 2px solid #3b1414;
              "
            ></i
            ><i
              style="
                right: 0;
                bottom: 0;
                width: 22px;
                height: 22px;
                background: #ffc1cc;
                border: 2px solid #3b1414;
                transform: rotate(12deg);
              "
            ></i
          ></span>
          <b>Closetix</b>
        </a>
        <div>
          <h2>Tu clóset te estaba esperando</h2>
          <p>Retoma tus outfits donde los dejaste.</p>
        </div>
      </aside>
      <main class="main">
        <section class="card-login">
          <h1>Bienvenid@ de vuelta</h1>
          <p class="sub">Entra para ver tus prendas y outfits.</p>
          <form id="frmLogin" method="POST">
            <div>
              <label for="usuario">Usuario</label
              ><input
                id="usuario"
                name="usuario"
                type="text"
                autocomplete="username"
                required
              />
            </div>
            <div>
              <label for="password">Contraseña</label
              ><input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button class="btn-login" type="submit">Log in</button>
          </form>
          <p class="alt">
            ¿Aún no tienes cuenta? <a href="signup.html">Sign up</a>
          </p>
        </section>
      </main>
    </div>
       <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JS/auth.js"></script>
  </body>
</html>
