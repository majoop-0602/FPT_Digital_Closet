<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up | Closetix</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
    />
    <link href="../CSS/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <aside class="side" style="background: #9f2d2d; color: #fffaf3">
        <div
          class="shape fl"
          style="
            right: -40px;
            top: 80px;
            width: 160px;
            height: 160px;
            border-radius: 58% 42% 55% 45% / 48% 58% 42% 52%;
            background: #ffc1cc;
          "
        ></div>
        
        <div
          class="shape sp"
          style="
            right: 80px;
            bottom: 50px;
            width: 120px;
            height: 120px;
            background: #ffc1cc;
            border: 0;
            clip-path: polygon(
              50% 0,
              61% 35%,
              98% 35%,
              68% 57%,
              79% 91%,
              50% 70%,
              21% 91%,
              32% 57%,
              2% 35%,
              39% 35%
            );
          "
        ></div>
        <div
          class="shape fl"
          style="
            left: 48%;
            top: 30%;
            width: 70px;
            height: 70px;
            background: #3b1414;
            border: 0;
            transform: rotate(45deg);
          "
        ></div>
        <a class="brand" href="../Index.html" style="color: #fffaf3">
          <span class="mark"
            ><i
              style="
                left: 0;
                top: 0;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: #9f2d2d;
                border: 2px solid #3b1414;
              "
            ></i
            ><i
              style="
                right: 0;
                bottom: 0;
                width: 22px;
                height: 22px;
                background: #ffc1cc;
                border: 2px solid #3b1414;
                transform: rotate(12deg);
              "
            ></i
          ></span>
          <b>Closetix</b>
        </a>
        <div>
          <h2>Ordena tu clóset desde hoy</h2>
          <p>Sube tu primera prenda y deja que Closetix haga el resto.</p>
        </div>
      </aside>
      <main class="main">
        <section class="card-login">
          <h1>Crea tu cuenta</h1>
          <p class="sub">Empieza a registrar tus prendas en un minuto.</p>
          <form id="frmSignup" method="POST">
            <div>
              <label for="usuario">Usuario</label
              ><input
                id="usuario"
                name="usuario"
                type="text"
                autocomplete="username"
                required
              />
            </div>
            <div>
              <label for="correo">Correo</label
              ><input
                id="correo"
                name="correo"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div>
              <label for="password">Contraseña</label
              ><input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
              />
            </div>
            <button class="btn-login" type="submit">Sign up</button>
          </form>
          <p class="alt">
            ¿Ya tienes cuenta? <a href="login.html">Log in</a>
          </p>
        </section>
      </main>
    </div>
       <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JS/auth.js"></script>
  </body>
</html>
