<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis prendas | Closetix</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
    />
    <link href="../CSS/style-folder.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a class="brand" href="../Index.html">
          <span class="mark"
            ><i
              style="
                left: 0;
                top: 0;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: #9f2d2d;
                border: 2px solid #3b1414;
              "
            ></i
            ><i
              style="
                right: 0;
                bottom: 0;
                width: 22px;
                height: 22px;
                background: #ffc1cc;
                border: 2px solid #3b1414;
                transform: rotate(12deg);
              "
            ></i
          ></span>
          <b>Closetix</b>
        </a>
        <a class="btn" id="btnSalir" href="login.html"
          >Cerrar sesión</a
        >
      </div>
    </header>

    <main class="wrap">
      <section class="intro">
        <div
          class="deco fl"
          style="
            right: 40px;
            top: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ffc1cc;
          "
        ></div>
        <div
          class="deco fl fl2"
          style="
            right: 150px;
            top: 90px;
            width: 34px;
            height: 34px;
            background: #9f2d2d;
            transform: rotate(20deg);
          "
        ></div>
        <div
          class="deco sp"
          style="
            right: 230px;
            top: 24px;
            width: 56px;
            height: 56px;
            border: 0;
            background: #3b1414;
            clip-path: polygon(
              50% 0,
              61% 35%,
              98% 35%,
              68% 57%,
              79% 91%,
              50% 70%,
              21% 91%,
              32% 57%,
              2% 35%,
              39% 35%
            );
          "
        ></div>
        <h1>Mis prendas</h1>
         <p>¡Hola <span id="nombreUsuario"></span>!</p>
      </section>

      <nav class="tabs" aria-label="Secciones">
        <a class="tab" href="prendas.html" aria-current="page"
          >Prendas</a
        >
        <a class="tab" href="">Outfits</a>
      </nav>

      <section class="folder">
        <div class="chips" id="chips" role="group" aria-label="Categorías">
          <button class="chip" type="button" data-cat="0" aria-pressed="true">
            Todos
          </button>
          <button class="chip" type="button" data-cat="1" aria-pressed="false">
            Tops
          </button>
          <button class="chip" type="button" data-cat="2" aria-pressed="false">
            Bottoms
          </button>
          <button class="chip" type="button" data-cat="3" aria-pressed="false">
            Vestidos
          </button>
          <button class="chip" type="button" data-cat="4" aria-pressed="false">
            Abrigos
          </button>
          <button class="chip" type="button" data-cat="5" aria-pressed="false">
            Calzado
          </button>
          <button class="chip" type="button" data-cat="6" aria-pressed="false">
            Bolsas
          </button>
          <button class="chip" type="button" data-cat="7" aria-pressed="false">
            Accesorios
          </button>
          <button class="chip" type="button" data-cat="8" aria-pressed="false">
            Otro
          </button>
        </div>

        <div class="tools">
          <p class="count" id="count" aria-live="polite"></p>
          <button
            class="more"
            type="button"
            id="more"
            aria-expanded="false"
            aria-controls="panel"
          >
            Más filtros <i></i>
          </button>
        </div>

        <div class="panel" id="panel">
          <div>
            <label for="marca">Marca</label
            ><input id="marca" type="text" placeholder="Ej. Zara" />
          </div>
          <div>
            <label for="temporada">Temporada</label>
            <select id="temporada">
              <option value="">Todas</option>
              <option value="primavera">Primavera</option>
              <option value="verano">Verano</option>
              <option value="otono">Otoño</option>
              <option value="invierno">Invierno</option>
              <option value="todo-el-ano">Todo el año</option>
            </select>
          </div>
          <div>
            <label for="color">Color</label>
            <select id="color">
              <option value="">Todos</option>
              <option value="negro">Negro</option>
              <option value="blanco">Blanco</option>
              <option value="gris">Gris</option>
              <option value="beige">Beige</option>
              <option value="rojo">Rojo</option>
              <option value="rosa">Rosa</option>
              <option value="azul">Azul</option>
              <option value="verde">Verde</option>
              <option value="amarillo">Amarillo</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <button class="btn" type="button" id="clear">Limpiar</button>
        </div>

        <!-- Las prendas se dibujan desde js/prendas.js -->
        <div class="grid" id="grid" aria-live="polite"></div>

        <div class="empty" id="empty">
          <div style="display: flex; justify-content: center; gap: 14px">
            <span
              style="
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: #9f2d2d;
                border: 2px solid #3b1414;
              "
            ></span>
            <span
              style="
                width: 40px;
                height: 40px;
                background: #ffc1cc;
                border: 2px solid #3b1414;
                transform: rotate(12deg);
              "
            ></span>
            <span
              style="
                width: 40px;
                height: 40px;
                background: #3b1414;
                clip-path: polygon(50% 0, 100% 100%, 0 100%);
              "
            ></span>
          </div>
          <h3>No encontramos prendas</h3>
          <p>Prueba con otros filtros o agrega una prenda nueva.</p>
        </div>
      </section>
    </main>

    <a
      class="fab"
      href="subir-prendas.html"
      aria-label="Agregar prenda"
      ><span>Agregar prenda</span></a
    >

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JS/sesion.js"></script>
    <script src="../JS/auth.js"></script>
    <script src="../JS/prendas.js"></script>
  </body>
</html>
